[general]
; Mantem o governor atual (powersave/intel_pstate). O gamemode NAO deve
; trocar para performance: nesta maquina isso dispara temperatura.
desiredgov = powersave
igpu_desiredgov = powersave

[cpu]
; Sem park/pin de cores - o 11400H nao tem E-cores.
park_cores = no
pin_cores = no

[gpu]
; Desligado: otimizacoes de GPU sao para AMD; clock lock na NVIDIA so
; esquenta sem ganho real numa GPU 4 GB limitada por VRAM.
apply_gpu_optimisations = 0
