# Mitigacao da regressao "Xid 109 CTX SWITCH TIMEOUT" do driver NVIDIA 615.x
# com Proton/DXVK. Afeta o caminho D3D11 (vkd3d/D3D12 nao usa essa opcao).
# Se o seu DXVK nao conhecer a opcao, ele apenas ignora com um aviso no log.
# Para reverter: apague este arquivo.
dxvk.enableNvRawAccessChains = False
