# HUD oculto por padrao - aperte Shift_R+F12 para mostrar/ocultar.
no_display

# Cap de fps: menos fps = menos calor. 60 e o alvo confortavel
# desta GPU; para jogos leves voce pode subir para 72/120.
fps_limit=60

gpu_stats
gpu_temp
gpu_power
vram
cpu_stats
cpu_temp
ram
frametime

position=top-right
font_size=18
background_alpha=0.5
